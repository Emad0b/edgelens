name: Verify EdgeLens
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m edgelens.train
  apple:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-mac.txt
      - run: python -m edgelens.export_coreml
      - run: python -m edgelens.evaluate_coreml
      - run: swift build -c release --package-path apple
      - uses: actions/upload-artifact@v4
        with:
          name: coreml-packages
          path: apple/Sources/EdgeLens/Resources

